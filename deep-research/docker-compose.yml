# M4 目标部署形态：app + postgres(pgvector) + redis + langfuse。
# M2 阶段只需 app 服务即可跑通（数据层尚用 SQLite checkpointer）。
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DR_CHECKPOINT_DB_PATH: /data/checkpoints.sqlite3
    volumes:
      - ./reports:/app/reports
      - app_data:/data
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deepresearch
      POSTGRES_PASSWORD: deepresearch
      POSTGRES_DB: deepresearch
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 可观测后端（M4 接入 deep_research 内的 tracing）
  langfuse:
    image: langfuse/langfuse:latest
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://deepresearch:deepresearch@postgres:5432/deepresearch
      REDIS_CONNECTION_STRING: redis://redis:6379
      NEXTAUTH_SECRET: change-me
      SALT: change-me
    ports:
      - "3000:3000"

volumes:
  app_data:
  pg_data:
