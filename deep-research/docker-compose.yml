# 部署形态：app + postgres(pgvector)。
#
# 数据层固定用 PostgreSQL：检查点（langgraph AsyncPostgresSaver）与长期记忆
# （pgvector HNSW）共用同一个库，因此 app 要等 postgres 健康后再启动。
#
# 关于可观测性：本项目用 Langfuse Cloud（.env 里配 DR_LANGFUSE_* 即可，
# 见 core/tracing.py）。**不自建 Langfuse 服务**——v3 自建还需额外拉起
# ClickHouse + MinIO/S3 + Redis + langfuse-worker 四个组件，本 compose 不承担；
# 确需自建请参考 https://langfuse.com/self-hosting 单独编排。
services:
  app:
    build:
      context: .
      args:
        # PyPI 镜像源，默认清华；海外可 UV_INDEX_URL=https://pypi.org/simple 覆盖
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # 覆盖 .env：容器内连 compose 网络里的 postgres 服务名，而不是 localhost
      DR_CHECKPOINT_BACKEND: postgres
      DR_DATABASE_URL: postgresql://deepresearch:deepresearch@postgres:5432/deepresearch
      DR_ENABLE_LONG_TERM_MEMORY: "true"
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deepresearch
      POSTGRES_PASSWORD: deepresearch
      POSTGRES_DB: deepresearch
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepresearch -d deepresearch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
