[project]
name = "deep-research"
version = "0.1.0"
description = "Multi-agent deep research system for AI/tech domain, built with LangGraph"
# README 在仓库根（../README.md），hatchling 要求 readme 必须在项目目录内，
# 因此用内联描述：构建不再依赖 deep-research/README.md 存在。
readme = { text = "多智能体深度研究系统（CiteTrace）：四角色编排 + 并行取证 + 可验证引用。完整说明见仓库根 README.md。", content-type = "text/markdown" }
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "pypdf>=5.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.1",
]
cli = [
    "typer>=0.15",
    "rich>=13.9",
]
pg = [
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "fastembed>=0.4",
]
observe = [
    "langfuse>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_mcp_adapters.*"]
ignore_missing_imports = true
