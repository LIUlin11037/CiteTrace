<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Research Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1f2733;
    --muted: #6b7683;
    --accent: #2f6fed;
    --accent-soft: #eaf1fe;
    --ok: #1a9c5b;
    --warn: #c47f17;
    --err: #d24545;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.65;
  }
  header {
    padding: 18px 24px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 24px 60px; }
  .row { display: flex; gap: 10px; align-items: center; }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    padding: 10px 18px;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { filter: brightness(1.06); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost {
    background: var(--panel);
    color: var(--accent);
  }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .card h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .step {
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .step.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .step.done { border-color: #cfe6d9; background: #eef8f2; color: var(--ok); }
  #log { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; max-height: 320px; overflow: auto; }
  #log li { margin-bottom: 3px; }
  #report {
    min-height: 260px;
    max-height: 66vh;
    overflow: auto;
  }
  #report pre.plain { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; }
  #report img { max-width: 100%; }
  #report code { background: #f1f3f6; padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  #report pre { background: #f6f8fa; padding: 10px; border-radius: 8px; overflow: auto; }
  #report table { border-collapse: collapse; }
  #report th, #report td { border: 1px solid var(--border); padding: 4px 8px; }
  .empty { color: var(--muted); font-size: 13px; }
  #approval { display: none; border-color: #f0d9ac; background: #fffaf0; }
  #approval h2 { color: var(--warn); }
  #plan { margin: 0; padding-left: 20px; }
  #plan li { margin-bottom: 6px; }
  #plan .q { font-weight: 600; }
  #plan .why { color: var(--muted); font-size: 12.5px; }
  #memories { margin-top: 10px; }
  #memories summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  #memories ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); font-size: 12.5px; }
  #memories li { margin-bottom: 4px; }
  #edit-plan {
    display: none;
    width: 100%;
    height: 160px;
    margin-top: 10px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12.5px;
    resize: vertical;
  }
  #banner {
    display: none;
    margin-top: 14px;
    padding: 10px 14px;
    border: 1px solid #f2c9c9;
    border-radius: var(--radius);
    background: #fdf2f2;
    color: var(--err);
    font-size: 13px;
  }
  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    margin-right: 6px;
    vertical-align: middle;
  }
  .status-dot.on { background: var(--ok); box-shadow: 0 0 0 3px #e6f5ed; }
  .status-dot.err { background: var(--err); box-shadow: 0 0 0 3px #fbeaea; }
</style>
</head>
<body>
<header>
  <h1>Deep Research Agent</h1>
  <p>多智能体深度研究系统 · Planner → Researcher×N → Critic → Writer · 全部结论均可溯源</p>
</header>

<div class="wrap">
  <div class="row">
    <input id="topic" type="text" placeholder="输入研究课题，例如：Agentic RAG 的最新进展与工程落地现状"
           autocomplete="off">
    <button id="start">开始调研</button>
  </div>

  <div id="banner"></div>

  <div id="approval" class="card" style="margin-top:16px">
    <h2>等待人工确认：研究计划</h2>
    <ol id="plan"></ol>
    <details id="memories" style="display:none">
      <summary>查看召回的历史记忆</summary>
      <ul id="memories-list"></ul>
    </details>
    <div class="row" style="margin-top:12px">
      <button id="approve">批准并开始调研</button>
      <button id="toggle-edit" class="ghost">编辑计划（可选）</button>
    </div>
    <textarea id="edit-plan" spellcheck="false"></textarea>
  </div>

  <div class="grid">
    <div class="card">
      <h2>执行状态</h2>
      <div class="steps">
        <span class="step" data-node="planner">Planner · 拆解课题</span>
        <span class="step" data-node="researcher">Researcher · 并行取证</span>
        <span class="step" data-node="critic">Critic · 审校证据</span>
        <span class="step" data-node="writer">Writer · 撰写报告</span>
      </div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">
        <span id="dot" class="status-dot"></span><span id="conn">未连接</span>
      </div>
      <ul id="log"></ul>
    </div>

    <div class="card">
      <h2>研究报告</h2>
      <div id="report" class="empty">提交课题后，Writer 撰写的内容会在这里逐字流出。</div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var els = {
    topic: document.getElementById("topic"),
    start: document.getElementById("start"),
    banner: document.getElementById("banner"),
    approval: document.getElementById("approval"),
    plan: document.getElementById("plan"),
    memories: document.getElementById("memories"),
    memoriesList: document.getElementById("memories-list"),
    approve: document.getElementById("approve"),
    toggleEdit: document.getElementById("toggle-edit"),
    editPlan: document.getElementById("edit-plan"),
    report: document.getElementById("report"),
    log: document.getElementById("log"),
    dot: document.getElementById("dot"),
    conn: document.getElementById("conn")
  };

  var NODE_LABEL = {
    planner: "Planner 拆解课题",
    researcher: "Researcher 并行取证",
    critic: "Critic 审校证据",
    writer: "Writer 撰写报告"
  };

  var state = {
    threadId: null,
    source: null,
    buffer: "",          // raw markdown accumulated from writer tokens
    renderTimer: null,
    currentPlan: null
  };

  // ---------- helpers ----------

  function showError(msg) {
    els.banner.textContent = "出错了：" + msg;
    els.banner.style.display = "block";
  }

  function clearError() {
    els.banner.style.display = "none";
    els.banner.textContent = "";
  }

  function setConn(kind, text) {
    els.dot.className = "status-dot" + (kind === "on" ? " on" : kind === "err" ? " err" : "");
    els.conn.textContent = text;
  }

  function addLog(text) {
    var li = document.createElement("li");
    li.textContent = text;
    els.log.appendChild(li);
    els.log.scrollTop = els.log.scrollHeight;
  }

  function setNode(node, cls) {
    var el = document.querySelector('.step[data-node="' + node + '"]');
    if (el && cls) el.className = "step " + cls;
  }

  // markdown render: marked if available, otherwise plain text
  function renderReport() {
    if (!state.buffer) return;
    if (window.marked && typeof window.marked.parse === "function") {
      try {
        els.report.innerHTML = window.marked.parse(state.buffer);
        els.report.className = "";
        return;
      } catch (e) { /* fall through to plain */ }
    }
    els.report.className = "";
    els.report.innerHTML = "";
    var pre = document.createElement("pre");
    pre.className = "plain";
    pre.textContent = state.buffer;
    els.report.appendChild(pre);
  }

  function scheduleRender() {
    if (state.renderTimer) return;
    state.renderTimer = setTimeout(function () {
      state.renderTimer = null;
      renderReport();
      els.report.scrollTop = els.report.scrollHeight;
    }, 120);
  }

  function appendToken(tok) {
    state.buffer += tok;
    scheduleRender();
  }

  // ---------- SSE ----------

  function closeSource() {
    if (state.source) {
      try { state.source.close(); } catch (e) { /* ignore */ }
      state.source = null;
    }
  }

  function openStream() {
    closeSource();
    var url = "/research/" + state.threadId + "/events";
    var es = new EventSource(url);
    state.source = es;

    es.onopen = function () {
      setConn("on", "已连接，调研进行中…");
    };

    es.onmessage = function (evt) {
      var data;
      try { data = JSON.parse(evt.data); } catch (e) { return; }
      handleFrame(data);
    };

    es.addEventListener("done", function () {
      // end of one stream segment (plan interrupt OR run finished)
      closeSource();
      if (state.currentPlan && els.approval.style.display === "block") {
        setConn("", "等待人工确认计划");
      } else {
        setConn("", "调研结束");
        addLog("流程结束");
      }
    });

    es.onerror = function () {
      // EventSource auto-reconnects; only report if we are not intentionally closed
      if (state.source === es) {
        setConn("err", "连接中断，正在重试…");
      }
    };
  }

  function handleFrame(data) {
    if (data.interrupt) {
      state.currentPlan = data.interrupt;
      renderPlan(data.interrupt);
      addLog("Planner 已产出计划，等待人工确认");
      return;
    }
    if (data.event === "error") {
      showError(data.message || "后端异常");
      setConn("err", "调研失败");
      return;
    }
    if (data.event === "on_chat_model_stream" && data.token) {
      appendToken(data.token);
      return;
    }
    if (data.event === "on_chain_start" && data.node) {
      if (NODE_LABEL[data.node]) {
        setNode(data.node, "active");
        addLog(NODE_LABEL[data.node] + " 开始");
      }
      return;
    }
    if (data.event === "on_chain_end" && data.node && NODE_LABEL[data.node]) {
      setNode(data.node, "done");
      addLog(NODE_LABEL[data.node] + " 完成");
    }
  }

  function renderPlan(payload) {
    var plan = payload && payload.plan ? payload.plan : {};
    els.plan.innerHTML = "";
    var subs = plan.sub_questions || [];
    subs.forEach(function (sq) {
      var li = document.createElement("li");
      var q = document.createElement("div");
      q.className = "q";
      q.textContent = "[" + (sq.id || "?") + "] " + (sq.question || "");
      li.appendChild(q);
      if (sq.rationale) {
        var why = document.createElement("div");
        why.className = "why";
        why.textContent = sq.rationale;
        li.appendChild(why);
      }
      els.plan.appendChild(li);
    });
    if (!subs.length) {
      els.plan.innerHTML = "<li class='empty'>（计划为空）</li>";
    }

    var mem = payload && payload.recalled_memories;
    if (mem && mem.length) {
      els.memories.style.display = "block";
      els.memoriesList.innerHTML = "";
      mem.forEach(function (m) {
        var li = document.createElement("li");
        li.textContent = m.length > 220 ? m.slice(0, 220) + "…" : m;
        els.memoriesList.appendChild(li);
      });
    } else {
      els.memories.style.display = "none";
    }

    // prefill editor with the original plan so edits start from a valid shape
    els.editPlan.value = JSON.stringify(plan, null, 2);
    els.approval.style.display = "block";
  }

  // ---------- actions ----------

  function resetRun(topic) {
    clearError();
    closeSource();
    state.threadId = null;
    state.currentPlan = null;
    state.buffer = "";
    els.report.className = "empty";
    els.report.textContent = "调研进行中，Writer 撰写的内容会在这里逐字流出。";
    els.log.innerHTML = "";
    els.approval.style.display = "none";
    els.editPlan.style.display = "none";
    els.approve.disabled = true;
    document.querySelectorAll(".step").forEach(function (s) { s.className = "step"; });
    addLog("课题：" + topic);
  }

  function startResearch() {
    var topic = els.topic.value.trim();
    if (!topic) { showError("请先输入研究课题"); return; }
    els.start.disabled = true;
    resetRun(topic);
    setConn("", "已提交，正在启动…");

    fetch("/research", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: topic })
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        state.threadId = data.thread_id;
        setNode("planner", "active");
        openStream();
      })
      .catch(function (e) {
        els.start.disabled = false;
        setConn("err", "启动失败");
        showError("无法创建调研任务（" + e.message + "）");
      });
  }

  function approvePlan(editedPlan) {
    if (!state.threadId) return;
    els.approve.disabled = true;
    var body = { approved: true, edited_plan: editedPlan || null };

    fetch("/research/" + state.threadId + "/resume", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function () {
        els.approval.style.display = "none";
        state.currentPlan = null;
        els.start.disabled = false;   // a new run may be started once this segment ends
        addLog("计划已批准，继续调研");
        setConn("", "已批准，正在继续…");
        openStream();               // per contract: reconnect for the resumed segment
      })
      .catch(function (e) {
        els.approve.disabled = false;
        showError("恢复调研失败（" + e.message + "）");
      });
  }

  // ---------- wiring ----------

  els.start.addEventListener("click", startResearch);
  els.topic.addEventListener("keydown", function (e) {
    if (e.key === "Enter") startResearch();
  });

  els.approve.addEventListener("click", function () {
    var edited = null;
    if (els.editPlan.style.display === "block") {
      var raw = els.editPlan.value.trim();
      if (raw) {
        try {
          edited = JSON.parse(raw);
        } catch (e) {
          showError("编辑后的计划不是合法 JSON：" + e.message);
          return;
        }
      }
    }
    clearError();
    approvePlan(edited);
  });

  els.toggleEdit.addEventListener("click", function () {
    var open = els.editPlan.style.display === "block";
    els.editPlan.style.display = open ? "none" : "block";
    els.toggleEdit.textContent = open ? "编辑计划（可选）" : "收起编辑器";
  });
})();
</script>
</body>
</html>
